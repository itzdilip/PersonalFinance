<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker PWA</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
        <div class="summary-cards">
            <div class="card">
                <h3>This Month</h3>
                <p id="monthly-total">₹0.00</p>
            </div>
            <div class="card">
                <h3>Total</h3>
                <p id="all-time-total">₹0.00</p>
            </div>
        </div>
    </header>

    <main>
        <section id="add-expense">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" required step="0.01" placeholder="e.g. 500">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transport">Transport</option>
                        <option value="Rent">Rent</option>
                        <option value="Bills & Utilities">Bills & Utilities</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Others">Others</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Lunch at office">
                </div>
                <button type="submit" class="btn-primary">Add Expense</button>
            </form>
        </section>

        <section id="actions">
            <button id="export-btn" class="btn-secondary">Export CSV</button>
            <label for="import-csv" class="btn-secondary">Import CSV</label>
            <input type="file" id="import-csv" accept=".csv" style="display: none;">
            <button id="reset-db-btn" class="btn-danger">Reset App</button>
        </section>

        <section id="expense-list">
            <h2>Recent Expenses</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="expense-tbody">
                        <!-- Expenses populated via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
