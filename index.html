<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow | Smart Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="assets/logo.svg">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-wallet"></i>
                <span>FinanceFlow</span>
            </div>
            <div id="user-profile" class="user-profile hidden">
                <div id="user-avatar-container">
                    <img id="user-avatar" src="" alt="User Avatar" class="hidden">
                    <i id="user-icon" class="fas fa-user-circle"></i>
                </div>
                <span id="user-name">Guest</span>
                <button id="edit-name-btn" title="Edit Name"><i class="fas fa-edit"></i></button>
                <button id="logout-btn" title="Logout" class="hidden"><i class="fas fa-sign-out-alt"></i></button>
            </div>
            <div id="auth-options">
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-size="medium"
                     data-theme="outline"
                     data-text="signin"
                     data-shape="rectangular"
                     data-logo_alignment="left">
                </div>
            </div>
        </div>
    </nav>

    <header class="app-header">
        <div class="header-content">
            <img src="assets/logo.svg" alt="FinanceFlow Logo" class="header-logo">
            <h1 id="welcome-msg">Welcome Back!</h1>
            <p>Keep track of your spending effortlessly.</p>
        </div>
        <div class="summary-grid">
            <div class="stat-card">
                <div class="stat-icon monthly">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="stat-info">
                    <h3>This Month</h3>
                    <p id="monthly-total">₹0.00</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon total">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="stat-info">
                    <h3>Total Balance</h3>
                    <p id="all-time-total">₹0.00</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-grid">
            <section id="add-expense" class="card">
                <div class="card-header">
                    <h2><i class="fas fa-plus-circle"></i> Add Transaction</h2>
                </div>
                <form id="expense-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount (₹)</label>
                            <div class="input-wrapper">
                                <span class="input-prefix">₹</span>
                                <input type="number" id="amount" required step="0.01" placeholder="0.00">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <!-- Categories populated via JS -->
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" placeholder="What was this for?">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Save Transaction
                    </button>
                </form>
            </section>

            <section id="actions" class="card action-card">
                <div class="card-header">
                    <h2><i class="fas fa-tools"></i> Tools</h2>
                </div>
                <div class="btn-group">
                    <button id="export-btn" class="btn-secondary">
                        <i class="fas fa-file-export"></i> Export CSV
                    </button>
                    <button id="drive-btn" class="btn-secondary">
                        <i class="fab fa-google-drive"></i> Save to Drive
                    </button>
                    <label for="import-csv" class="btn-secondary">
                        <i class="fas fa-file-import"></i> Import CSV
                    </label>
                    <input type="file" id="import-csv" accept=".csv" style="display: none;">
                    <button id="reset-db-btn" class="btn-danger">
                        <i class="fas fa-trash-alt"></i> Reset All
                    </button>
                </div>
            </section>
        </div>

        <section id="expense-list" class="card table-card">
            <div class="card-header">
                <h2><i class="fas fa-list"></i> Recent Transactions</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th class="text-right">Amount</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="expense-tbody">
                        <!-- Expenses populated via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 FinanceFlow. Secure & Private Expense Tracking.</p>
    </footer>

    <script type="module" src="js/app.js"></script>
    <script>
        // Callback for Google Identity Services
        function handleCredentialResponse(response) {
            // This will be handled in app.js via event or global exposure
            window.dispatchEvent(new CustomEvent('google-signed-in', { detail: response.credential }));
        }
    </script>
</body>
</html>
